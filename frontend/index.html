<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- Preload is necessary because we show these images when we disconnect from the server,
    but at that point we cannot load these images from the server -->
    <link rel="preload" href="/src/assets/gradient.png" as="image" />
    <link rel="preload" href="/src/assets/noise.png" as="image" />
    <!-- Preload the fonts -->
    <link rel="preload" href="/src/fonts/Lora/Lora-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/src/fonts/PT_Sans/PTSans-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/src/fonts/PT_Sans/PTSans-Bold.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/src/fonts/Fira_Mono/FiraMono-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/src/fonts/Fira_Mono/FiraMono-Medium.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/src/fonts/Fira_Mono/FiraMono-Bold.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="a marimo app" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <marimo-filename hidden>{{ filename }}</marimo-filename>
    <!-- TODO(Trevor): Legacy, required by VS Code plugin. Remove when plugin is updated (see marimo/server/_templates/template.py) -->
    <marimo-version data-version="{{ version }}" hidden></marimo-version>
    <marimo-user-config data-config="{{ user_config }}" hidden></marimo-user-config>
    <marimo-server-token data-token="{{ server_token }}" hidden></marimo-server-token>
    <!-- /TODO -->
    <title>{{ title }}</title>
  </head>
  <body>
    <div id="root"></div>
    <script data-marimo="true">
      Object.defineProperty(window, "__MARIMO_MOUNT_CONFIG__", {
        value: Object.freeze('{{ mount_config }}'),
        writable: false,
        configurable: false,
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
